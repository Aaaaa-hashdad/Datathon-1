<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#500000">
<title>RevGym Camera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
  :root {
    --brand: #500000; --brand-hi: #6e0b10; --brand-glow: rgba(140, 20, 24, .55);
    --fg: #ffffff; --muted: rgba(255,255,255,.7); --glass: rgba(20, 12, 12, .55);
    --line: rgba(255,255,255,.14); --warn: #e7a840;
    --font: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; color: var(--fg); font-family: var(--font);
    background: radial-gradient(120% 80% at 50% 0%, #3a0608 0%, #1a0405 55%, #0b0202 100%);
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  button, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* camera fills the screen and fades in */
  video {
    position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain;
    background: transparent; opacity: 0; transform: scale(1.04);
    transition: opacity .6s var(--ease), transform .8s var(--ease);
  }
  video.mirror { transform: scaleX(-1) scale(1.04); }
  body.has-cam video { opacity: 1; transform: none; }
  body.has-cam video.mirror { transform: scaleX(-1); }
  .shade { position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 58%, rgba(0,0,0,.75) 100%); }

  /* top bar */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
  }
  .logo { display: block; width: 68px; height: auto; border-radius: 14px; background: #faf8f6;
    box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 6px 18px rgba(0,0,0,.45); }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 600; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: background .3s, border-color .3s; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.5); transition: background .3s; }
  .pill.jpeg::before { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .pill.rtc { background: rgba(80,0,0,.8); border-color: rgba(255,120,120,.35); }
  .pill.rtc::before { background: #ff4d4d; animation: ring 1.6s ease-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,77,77,.7); } 100% { box-shadow: 0 0 0 9px rgba(255,77,77,0); } }

  /* empty state before the camera opens */
  .empty { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
    gap: 14px; text-align: center; padding: 0 32px 180px; transition: opacity .4s var(--ease), transform .5s var(--ease); }
  body.has-cam .empty { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  .empty .ring { width: 92px; height: 92px; border-radius: 28px; display: grid; place-items: center;
    background: linear-gradient(160deg, #6e0b10, #3a0306); box-shadow: 0 16px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.1) inset; }
  .empty h2 { margin: 6px 0 0; font-size: 22px; font-weight: 700; }
  .empty p { margin: 0; color: var(--muted); font-size: 15px; max-width: 300px; line-height: 1.45; }

  /* corner guides frame the lifter */
  .guides { position: fixed; inset: 18% 10% 30%; pointer-events: none; opacity: 0; transition: opacity .5s; }
  body.has-cam .guides { opacity: .55; }
  .guides i { position: absolute; width: 26px; height: 26px; border: 3px solid #fff; border-radius: 4px; transition: border-color .4s; }
  .guides i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .guides i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .guides i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .guides i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  body[data-mode="rtc"] .guides i { border-color: #ff8a8a; }

  /* bottom controls */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 18px); display: grid; gap: 14px; justify-items: center; }
  #status { min-height: 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
  .controls { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .seg { justify-self: start; display: inline-flex; padding: 3px; border-radius: 999px; background: var(--glass);
    border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .seg button { border: 0; background: transparent; padding: 7px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
    color: var(--muted); cursor: pointer; transition: background .25s var(--ease), color .25s; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--brand); }
  .icon-btn { justify-self: end; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--glass); display: grid; place-items: center; cursor: pointer;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .25s var(--ease); }
  .icon-btn:active { transform: scale(.92) rotate(-30deg); }

  /* big shutter-style start button */
  #start { position: relative; width: 84px; height: 84px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: transparent; display: grid; place-items: center; }
  #start::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 4px solid #fff;
    box-shadow: 0 6px 22px rgba(0,0,0,.4); }
  #start .core { width: 66px; height: 66px; border-radius: 50%; background: var(--brand);
    box-shadow: 0 0 0 1px rgba(255,255,255,.15) inset, 0 0 26px var(--brand-glow);
    transition: width .35s var(--ease), height .35s var(--ease), border-radius .35s var(--ease), background .3s, transform .15s; }
  #start:active .core { transform: scale(.93); }
  #start.on .core { width: 34px; height: 34px; border-radius: 9px; background: #e02a2a; }
  #start.on::after { content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid rgba(224,42,42,.6); animation: halo 1.8s ease-out infinite; }
  @keyframes halo { from { transform: scale(.95); opacity: 1; } to { transform: scale(1.18); opacity: 0; } }
  @media (max-width: 380px) {
    .controls { gap: 8px; }
    .seg button { padding-inline: 6px; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-mode="idle">
  <video id="video" autoplay playsinline muted></video>
  <div class="shade"></div>
  <div class="guides"><i></i><i></i><i></i><i></i></div>

  <header>
    <img class="logo" alt="RevGym" src="/ui/assets/reveille-logo.png">
    <span id="mode" class="pill idle">Ready</span>
  </header>

  <div class="empty">
    <div class="ring">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
      </svg>
    </div>
    <h2>Gig 'em. Let's film a set.</h2>
    <p>Prop your phone up so your whole body is in frame, then tap the button to stream to your PC.</p>
  </div>

  <div class="dock">
    <div id="status" role="status">Not streaming</div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Video quality">
        <button data-q="480" aria-pressed="false">480p</button>
        <button data-q="720" aria-pressed="true">720p</button>
        <button data-q="1080" aria-pressed="false">1080p</button>
      </div>
      <button id="start" aria-pressed="false"><span class="core"></span><span class="sr" id="startLabel">Start streaming</span></button>
      <button id="flip" class="icon-btn" aria-label="Flip camera">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 11a8 8 0 0 0-14.9-3"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3"/><path d="M20 20v-4h-4"/>
        </svg>
      </button>
    </div>
    <select id="quality" hidden>
      <option value="480">480p</option>
      <option value="720" selected>720p</option>
      <option value="1080">1080p</option>
    </select>
  </div>

<script type="module">
import { createVideoClock, nextVideoFrame } from './video-frame.mjs';

// Two ways to get video to the PC:
//  1. WebRTC (preferred): real 30 fps video using the phone's hardware encoder.
//  2. JPEG uploads (fallback): used until WebRTC connects, or if it can't.
const video = document.getElementById('video');
const startBtn = document.getElementById('start');
const startLabel = document.getElementById('startLabel');
const statusEl = document.getElementById('status');
const modeEl = document.getElementById('mode');
const qualitySel = document.getElementById('quality');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

let stream = null;
let facing = 'environment';
let running = false;
let jpegRun = 0;
let pc = null, sender = null, rtcLive = false;

function setMode(m) {
  modeEl.textContent = m === 'rtc' ? 'Live' : m === 'jpeg' ? 'Picture mode' : 'Ready';
  modeEl.className = 'pill ' + m;
  document.body.dataset.mode = m;
}

async function openCamera() {
  const old = stream;
  const h = Number(qualitySel.value);
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, height: { ideal: h }, frameRate: { ideal: 30 } },
    audio: false,
  });
  const track = stream.getVideoTracks()[0];
  track.contentHint = 'motion';               // favour smooth motion over sharp still detail
  video.srcObject = stream;
  await video.play();
  document.body.classList.add('has-cam');
  video.classList.toggle('mirror', facing === 'user');
  if (sender) await sender.replaceTrack(track).catch(() => {});
  if (old) old.getTracks().forEach((t) => t.stop());
}

// ---------------- WebRTC ----------------
function iceComplete(conn, ms) {
  if (conn.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => { if (conn.iceGatheringState === 'complete') { conn.removeEventListener('icegatheringstatechange', done); resolve(); } };
    conn.addEventListener('icegatheringstatechange', done);
    setTimeout(resolve, ms);                    // on a LAN the host candidates come almost at once
  });
}
function waitConnected(conn, ms) {
  return new Promise((resolve, reject) => {
    const check = () => {
      if (conn.connectionState === 'connected') resolve();
      else if (['failed', 'closed'].includes(conn.connectionState)) reject(new Error(conn.connectionState));
    };
    conn.addEventListener('connectionstatechange', check);
    check();
    setTimeout(() => reject(new Error('timed out connecting')), ms);
  });
}
function closeRtc() {
  rtcLive = false;
  if (pc) { try { pc.close(); } catch {} }
  pc = null; sender = null;
}

async function rtcConnect() {
  pc = new RTCPeerConnection({ iceServers: [] });   // same Wi-Fi: no STUN/TURN needed
  sender = pc.addTrack(stream.getVideoTracks()[0], stream);
  pc.addEventListener('connectionstatechange', () => {
    if (['failed', 'disconnected', 'closed'].includes(pc?.connectionState)) {
      closeRtc();
      setMode('jpeg');
    }
  });
  await pc.setLocalDescription(await pc.createOffer());
  await iceComplete(pc, 2000);
  const { id } = await (await fetch('/rtc/offer', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: pc.localDescription.type, sdp: pc.localDescription.sdp }),
  })).json();

  statusEl.textContent = 'Waiting for the PC viewer to answer…';
  let answer = null;
  for (let i = 0; i < 2 && !answer && running; i++) {     // two 15 s long-polls
    const r = await fetch(`/rtc/answer?id=${encodeURIComponent(id)}`);
    if (r.status === 200) answer = await r.json();
  }
  if (!answer) throw new Error('no PC viewer answered');
  await pc.setRemoteDescription(answer);
  await waitConnected(pc, 8000);

  // Ask for a high bitrate and keep the frame rate up when the network is tight.
  const p = sender.getParameters();
  if (!p.encodings || !p.encodings.length) p.encodings = [{}];
  p.encodings[0].maxBitrate = 4_000_000;
  p.encodings[0].maxFramerate = 30;
  p.degradationPreference = 'maintain-framerate';
  await sender.setParameters(p).catch(() => {});
  rtcLive = true;
  setMode('rtc');
}

async function rtcLoop() {
  while (running) {
    if (!rtcLive) {
      try { await rtcConnect(); }
      catch (e) { closeRtc(); setMode('jpeg'); statusEl.textContent = `Video not connected (${e.message}); retrying…`; await sleep(3000); }
    } else {
      await sleep(1000);
      await showRtcStats();
    }
  }
  closeRtc();
}

let lastStats = null;
async function showRtcStats() {
  if (!pc) return;
  const stats = await pc.getStats(sender);
  for (const s of stats.values()) {
    if (s.type !== 'outbound-rtp' || s.kind !== 'video') continue;
    let kbps = '';
    if (lastStats) kbps = ` · ${Math.round((s.bytesSent - lastStats.bytesSent) * 8 / (s.timestamp - lastStats.timestamp))} kbps`;
    lastStats = s;
    statusEl.textContent = `Video ${s.frameWidth || '?'}x${s.frameHeight || '?'} @ ${Math.round(s.framesPerSecond || 0)} fps${kbps}`;
  }
}

// ---------------- JPEG fallback ----------------
// Two uploads in flight at once, so we don't sit idle waiting for each reply.
async function jpegLoop(run) {
  const captureStream = `${performance.timeOrigin}-${run}`;
  const frameTime = createVideoClock();
  let inflight = 0, sent = 0, t0 = performance.now();
  while (running && run === jpegRun) {
    if (rtcLive || !video.videoWidth || inflight >= 2) { await sleep(rtcLive ? 250 : 10); continue; }
    const frame = await nextVideoFrame(video);
    if (!running || run !== jpegRun || rtcLive || !video.videoWidth) continue;
    const capturedAt = frameTime(video, frame);
    if (capturedAt === null) continue;
    const scale = Math.min(1, 640 / video.videoWidth);          // small frames upload faster
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.65));
    if (!blob || !running || run !== jpegRun || rtcLive) continue;
    inflight++;
    fetch('/frame', { method: 'POST', body: blob, headers: {
      'Content-Type': 'image/jpeg', 'X-Capture-Time': String(capturedAt), 'X-Capture-Stream': captureStream,
    } })
      .then(() => { sent++; })
      .catch((e) => { statusEl.textContent = 'Upload failed: ' + e.message; })
      .finally(() => { inflight--; });
    const dt = (performance.now() - t0) / 1000;
    if (dt > 1 && !rtcLive) {
      statusEl.textContent = `Pictures ${canvas.width}x${canvas.height} @ ${(sent / dt).toFixed(1)} fps`;
      sent = 0; t0 = performance.now();
    }
  }
}

startBtn.onclick = async () => {
  if (running) {
    running = false;
    closeRtc();
    startLabel.textContent = 'Start streaming';
    startBtn.classList.remove('on');
    startBtn.setAttribute('aria-pressed', 'false');
    statusEl.textContent = 'Stopped';
    setMode('idle');
    return;
  }
  startSensors();               // must start from the tap (iPhone asks permission)
  startBtn.disabled = true;
  try {
    if (!stream) await openCamera();
    running = true;
    startLabel.textContent = 'Stop streaming';
    startBtn.classList.add('on');
    startBtn.setAttribute('aria-pressed', 'true');
    setMode('jpeg');
    jpegLoop(++jpegRun);
    rtcLoop();
  } catch (e) {
    statusEl.textContent = 'Camera error: ' + e.message +
      (window.isSecureContext ? '' : ' (page must be opened over https)');
  } finally {
    startBtn.disabled = false;
  }
};

document.getElementById('flip').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) await openCamera().catch((e) => statusEl.textContent = e.message);
};
const qualityButtons = document.querySelectorAll('[data-q]');
qualityButtons.forEach((button) => {
  button.onclick = () => {
    if (qualitySel.value === button.dataset.q) return;
    qualitySel.value = button.dataset.q;
    qualityButtons.forEach((option) => option.setAttribute('aria-pressed', String(option === button)));
    if (stream) openCamera().catch((e) => { statusEl.textContent = e.message; });
  };
});

// ---------------- motion sensors ----------------
// The PC's room lock uses gravity for the true vertical in the picture, and the
// rotation rate / gravity direction to notice when the phone itself moved.
// Sent ~5x a second while streaming. Sign conventions differ between phones (iOS
// reports gravity the other way round); the PC checks the sign against the body.
let sensorsOn = false, grav = null, rotMax = 0;
async function startSensors() {
  if (sensorsOn || !('DeviceMotionEvent' in window)) return;
  try {
    if (typeof DeviceMotionEvent.requestPermission === 'function'
        && (await DeviceMotionEvent.requestPermission()) !== 'granted') return;
  } catch { return; }
  sensorsOn = true;
  window.addEventListener('devicemotion', (e) => {
    const a = e.accelerationIncludingGravity;
    if (a?.x != null) {
      const v = [a.x, a.y, a.z];
      grav = grav ? grav.map((g, i) => g * 0.85 + v[i] * 0.15) : v;   // low-pass: keep only gravity
    }
    const r = e.rotationRate;
    if (r) rotMax = Math.max(rotMax, Math.abs(r.alpha || 0), Math.abs(r.beta || 0), Math.abs(r.gamma || 0));
  });
  setInterval(() => {
    if (!running || !grav) return;
    const [gx, gy, gz] = grav, n = Math.hypot(gx, gy, gz) || 1;
    const th = ((screen.orientation?.angle ?? window.orientation ?? 0) * Math.PI) / 180;
    // Up in screen coordinates (x right, y up), then in video-image coordinates (y down).
    // The front camera's picture is left-right flipped relative to the screen.
    const sx = gx * Math.cos(th) - gy * Math.sin(th), sy = gx * Math.sin(th) + gy * Math.cos(th);
    const upImg = [(facing === 'user' ? -sx : sx) / n, -sy / n];
    const body = JSON.stringify({ up: [gx / n, gy / n, gz / n], upImg, tiltDeg: Math.round(Math.asin(Math.max(-1, Math.min(1, gz / n))) * 1800 / Math.PI) / 10, rotMax: Math.round(rotMax), facing });
    rotMax = 0;
    fetch('/sensor', { method: 'POST', body, headers: { 'Content-Type': 'application/json' } }).catch(() => {});
  }, 200);
}
</script>
</body>
</html>
